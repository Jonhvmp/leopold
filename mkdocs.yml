site_name: Leopold
site_description: An autonomous orchestration harness for Claude Code and Codex CLI. Brief it like a teammate; it conducts your coding agent in your seat.
site_url: https://jonhvmp.github.io/leopold/
site_author: Jonhvmp
repo_url: https://github.com/Jonhvmp/leopold
repo_name: Jonhvmp/leopold
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Jonhvmp — MIT

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/music-clef-treble
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          site_description: Um harness de orquestração autônoma para o Claude Code e o Codex CLI. Faça o brief como para um colega; ele conduz o seu agente na sua cadeira.
          nav_translations:
            Home: Início
            Getting Started: Primeiros passos
            Install: Instalação
            Quickstart: Início rápido
            Your First Run: Sua primeira run
            Toolchain Manager: Gerenciador de toolchain
            Concepts: Conceitos
            What Is a Harness: O que é um harness
            Claude Code and Codex: Claude Code e Codex
            The Two Phases: As duas fases
            Dynamic Workflows: Workflows dinâmicos
            Personas: Personas
            Continuity: Continuidade
            The Canvas: O Canvas
            Quality & Orchestration: Qualidade e orquestração
            Decision Protocol: Protocolo de decisão
            Cost & Security: Custo e segurança
            Run Isolation: Isolamento da run
            gstack Playbook: Playbook do gstack
            Architecture: Arquitetura
            Overview: Visão geral
            In-Session Engine: Engine in-session
            SDK Driver: Driver SDK
            Conductor & Worker Protocol: Protocolo maestro–worker
            Reference: Referência
            Prompt Enhancer: Prompt Enhancer
            Brief Artifacts: Artefatos do brief
            Plan Grammar: Gramática do plano
            Driver Config: Config do driver
            SDK Worker Hooks: Hooks do worker SDK
            Comparisons: Comparações
            Contributing: Como contribuir

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jonhvmp/leopold
  generator: false

# Internal launch drafts live in docs/launch/ but are not part of the published site.
exclude_docs: |
  launch/

nav:
  - Home: index.md
  - Getting Started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Your First Run: getting-started/first-run.md
      - Toolchain Manager: getting-started/toolchain-manager.md
  - Concepts:
      - What Is a Harness: concepts/harness.md
      - Claude Code and Codex: concepts/harnesses.md
      - The Two Phases: concepts/two-phases.md
      - Dynamic Workflows: concepts/dynamic-workflows.md
      - Personas: concepts/personas.md
      - Continuity: concepts/continuity.md
      - The Canvas: canvas.md
      - Quality & Orchestration: quality-and-orchestration.md
      - Decision Protocol: decision-protocol.md
      - Guardrails: guardrails.md
      - Cost & Security: cost-and-security.md
      - Run Isolation: run-isolation.md
      - gstack Playbook: gstack-playbook.md
  - Architecture:
      - Overview: architecture.md
      - In-Session Engine: architecture/in-session.md
      - SDK Driver: architecture/driver.md
      - Conductor & Worker Protocol: architecture/protocol.md
  - Reference:
      - Skills: reference/skills.md
      - Hooks: reference/hooks.md
      - Prompt Enhancer: reference/enhance.md
      - Brief Artifacts: reference/artifacts.md
      - Plan Grammar: reference/plan-grammar.md
      - Driver Config: reference/driver-config.md
      - Asset Home: reference/leopold-home.md
      - SDK Worker Hooks: reference/sdk-worker-hooks.md
  - Comparisons:
      - Leopold vs Ralph: comparisons/ralph.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
