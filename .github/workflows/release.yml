name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: ver
        run: echo "v=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Tag already exists?
        id: tag
        run: |
          if git rev-parse "v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag + GitHub Release
        if: steps.tag.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.ver.outputs.v }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$V"
          git push origin "$V"
          notes="$(awk -v ver="${{ steps.ver.outputs.v }}" 'BEGIN{f=0} $0 ~ "## \\["ver"\\]"{f=1;next} /^## \[/{if(f)exit} f{print}' CHANGELOG.md)"
          [ -z "$notes" ] && notes="Leopold $V"
          gh release create "$V" --title "Leopold $V" --notes "$notes"
      - name: Setup Node for npm publish
        if: steps.tag.outputs.new == 'true' && env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish leopold-driver to npm
        if: steps.tag.outputs.new == 'true' && env.NPM_TOKEN != ''
        working-directory: packages/driver
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "leopold-driver@$V" version >/dev/null 2>&1; then
            echo "leopold-driver@$V already on npm — skipping publish."
          else
            npm ci || npm install
            npm publish --access public
          fi
