name: ci

# One pipeline, many nodes: validation (hooks / driver / docs / codeql) fans out in
# parallel, then delivery (docs-deploy / release) runs on main only, after every node
# is green. Autonomous/scheduled work lives in its own workflow (security-sweep.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---- validation (runs on every push + PR) --------------------------------
  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check hooks, installer, scripts, and extensions
        run: bash -n hooks/stop-continuity.sh hooks/guard-irreversible.sh install.sh scripts/*.sh extensions/*/*.sh
      - name: Shellcheck every shell entrypoint (warning level)
        run: shellcheck -S warning hooks/*.sh install.sh scripts/*.sh extensions/*/*.sh
      - name: Byte-compile Python scripts (dashboard, extension engines)
        run: python3 -m py_compile scripts/*.py extensions/*/payload/*.py
      - name: Hook behavior tests
        run: bash scripts/test-hooks.sh
      - name: Doctor project-continuity tests
        run: bash scripts/test-doctor-continuity.sh
      - name: Guard red-team tests (bypass attempts must stay blocked)
        run: bash scripts/test-guard.sh
      - name: Enhance behavior tests (stubbed claude, no network)
        run: bash scripts/test-enhance.sh
      - name: "Shared harness-wiring tests (hermetic: temp CLAUDE_HOME/CODEX_HOME)"
        run: bash scripts/test-harness-lib.sh
      - name: "Codex install end to end (hermetic: temp homes, stubbed PATH, no network)"
        run: bash scripts/test-codex-install.sh
      - name: Skill path tests (no SKILL.md may hardcode a harness home)
        run: bash scripts/test-skill-paths.sh
      - name: "Toolchain menu harness switch (hermetic: temp homes, stubbed PATH)"
        run: bash scripts/test-menu-harness.sh
      - name: "Serena extension per harness (hermetic: temp homes, stubbed CLIs)"
        run: bash scripts/test-serena-ext.sh
      - name: "Enhance extension per harness (hermetic: temp homes)"
        run: bash scripts/test-enhance-ext.sh
      - name: "ovmem extension per harness (hermetic: temp homes, stubbed OpenViking)"
        run: bash scripts/test-ovmem-ext.sh
      - name: "gstack extension per harness (hermetic: temp homes, stubbed git, no bun)"
        run: bash scripts/test-gstack-ext.sh
      - name: Dashboard DAG + transcript tests (Claude + Codex parsing, stdlib only)
        run: python3 scripts/test-watch-graph.py
      - name: "Watcher continuity relaunch tests (hermetic: stub harnesses, temp homes)"
        run: python3 scripts/test-watch-continuity.py

  driver:
    name: driver (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/driver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/driver/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke — exercise the built binary against a fixture brief
        working-directory: .
        run: bash scripts/test-cli-smoke.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ---- delivery (only on main, after validation passes) --------------------
  docs-deploy:
    name: docs-deploy
    needs: [hooks, driver, docs, codeql]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs gh-deploy --force

  release:
    name: release
    needs: [hooks, driver, docs, codeql]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # npm --provenance (supply-chain attestation)
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read version
        id: ver
        run: echo "v=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Tag already exists?
        id: tag
        run: |
          if git rev-parse "v${{ steps.ver.outputs.v }}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag + GitHub Release
        if: steps.tag.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.ver.outputs.v }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$V"
          git push origin "$V"
          notes="$(awk -v ver="${{ steps.ver.outputs.v }}" 'BEGIN{f=0} $0 ~ "## \\["ver"\\]"{f=1;next} /^## \[/{if(f)exit} f{print}' CHANGELOG.md)"
          [ -z "$notes" ] && notes="Leopold $V"
          gh release create "$V" --title "Leopold $V" --notes "$notes"
      - name: Setup Node for npm
        if: steps.tag.outputs.new == 'true' && env.NPM_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish leopold-driver to npm (idempotent)
        if: steps.tag.outputs.new == 'true' && env.NPM_TOKEN != ''
        working-directory: packages/driver
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Single source of truth: the npm package version tracks the repo VERSION.
          V="$(tr -d '[:space:]' < ../../VERSION)"
          if npm view "leopold-driver@$V" version >/dev/null 2>&1; then
            echo "leopold-driver@$V already on npm — skipping publish."
          else
            npm ci
            npm version "$V" --no-git-tag-version --allow-same-version >/dev/null
            npm publish --access public --provenance
          fi
