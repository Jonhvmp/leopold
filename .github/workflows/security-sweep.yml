# Autonomous scheduled work lives here, separate from the reactive ci pipeline.
# Weekly CodeQL sweep over the default branch — catches newly-published query packs
# and rules against code that hasn't changed (a PR-only scan never re-checks old code).
name: security-sweep

on:
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC
  workflow_dispatch: {}   # run it on demand too

permissions:
  contents: read

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
